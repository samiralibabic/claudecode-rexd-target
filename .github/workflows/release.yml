name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run typecheck
          bun test
          bun run build

      - name: Package plugin
        run: |
          mkdir -p release
          zip -r release/claudecode-rexd-target.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x "release/*" \
            -x ".claude/settings.local.json"

      - name: Generate checksums
        run: |
          cd release
          sha256sum claudecode-rexd-target.zip > checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/claudecode-rexd-target.zip
            release/checksums.txt
          generate_release_notes: true
